<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>CPU Clicker</title>

  <!-- Telegram SDK (нужен, чтобы Mini App знал, что он внутри Telegram) -->
  <script src="https://telegram.org/js/telegram-web-app.js"></script>

  <!-- Стили отдельно -->
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>

  <main class="app">

    <!-- Шапка с балансом -->
    <header class="balance-block">
      <!-- Блок выносливости (энергии) -->
<section class="energy-block">
  <div class="energy-info">
    <span>⚡ Энергия</span>
    <span id="energy-value">500 / 500</span>
  </div>
  <div class="energy-bar-bg">
    <div class="energy-bar-fill" id="energy-bar-fill"></div>
  </div>
</section>
      <span class="balance-label">Баланс</span>
      <div class="balance">
        <span id="balance-value">0.00000000</span>
        <span class="balance-unit">BTC</span>
      </div>
      <div class="per-click">
        за клик: <span id="per-click-value">0.00000001</span> BTC
      </div>
    </header>

    <!-- Кликабельный процессор -->
    <section class="cpu-zone">
      <button id="cpu-button" class="cpu" aria-label="Кликнуть по процессору">
        <div class="cpu-inner">
          <span class="cpu-icon">🧠</span>
          <span class="cpu-text">CPU</span>
        </div>
      </button>
    </section>

    <!-- Нижняя панель -->
<footer class="bottom-bar">
  <button class="tab active" id="tab-click">🖱️ Клик</button>
  <button class="tab" id="tab-shop">🛒 Магазин</button>
  <button class="tab" disabled>🖥️ Ферма</button>
</footer>

<!-- Экран магазина (скрыт по умолчанию) -->
<section class="shop-screen hidden" id="shop-screen">
  <h2 class="shop-title">Улучшения</h2>
  
  <div class="shop-category">
    <h3>👆 Сила клика</h3>
    <div id="list-click" class="upgrade-list"></div>
  </div>

  <div class="shop-category">
    <h3>⛏️ Майнинг (в секунду)</h3>
    <div id="list-mining" class="upgrade-list"></div>
  </div>

  <div class="shop-category">
    <h3>⚡ Энергия</h3>
    <div id="list-energy" class="upgrade-list"></div>
  </div>
</section>

  </main>

  <!-- Тело (логика) отдельно -->
  <script src="js/app.js"></script>
</body>
</html>
